  token-generator:
    title: Générateur de Token Aléatoire - Clés API, Mots de passe & Chaînes Sécurisées
    description: >-
      Générez des tokens aléatoires sécurisés, des clés API, des mots de passe
      et des chaînes alphanumériques en ligne. Créez des tokens cryptographiques
      de longueur personnalisée avec des majuscules, des minuscules, des
      chiffres et des symboles spéciaux. Parfait pour l'authentification, les
      IDs de session et les clés secrètes.
    uppercase: Majuscules (ABC...)
    lowercase: Minuscules (abc...)
    numbers: Chiffres (123...)
    symbols: Symboles (!-;...)
    button:
      copy: Copier
      refresh: Rafraichir
    copied: Le token a été copié
    length: Longueur
    tokenPlaceholder: Le token...

  ascii-text-drawer:
    title: Générateur d'Art ASCII et Dessinateur de Texte - Créateur de Bannières en Ligne avec Polices Figlet
    description: Créez de l'art ASCII et des bannières de texte en ligne. Convertissez du texte en art ASCII avec plusieurs styles de polices Figlet. Générateur de texte ASCII gratuit pour bannières de terminal, art de commentaires de code, décoration de README GitHub et messages Discord/Reddit. Prend en charge les polices 3D, les lettres en bloc, les polices inclinées, les styles d'ombre et la calligraphie. Créateur d'art ASCII en ligne avec copier-coller. Parfait pour les développeurs, programmeurs et design de texte créatif.

  html-entities:
    title: Encodeur & Décodeur d'Entités HTML En Ligne - Échapper/Désé chapper les Caractères HTML Gratuitement
    description: Encodez et décodez les entités HTML en ligne. Échappez les caractères spéciaux (<, >, &, ", ') en entités HTML pour la prévention XSS et la sécurité web. Convertissez les entités HTML en texte et vice versa. Convertisseur d'entités HTML gratuit pour encoder les esperluettes, guillemets, crochets et caractères unicode. Parfait pour assainir les entrées utilisateur, prévenir l'injection HTML et le développement web sécurisé.

  url-parser:
    title: Analyseur d'URL En Ligne - Décoder les Composants URL, Query Strings & Paramètres Gratuitement
    description: Analysez et décortiquez les URLs en ligne. Décomposez les adresses web en protocole, nom d'hôte, port, chemin, paramètres de requête, hash, nom d'utilisateur et mot de passe. Outil d'analyse URL gratuit pour les développeurs pour décoder les query strings, extraire les composants URL et valider la structure d'URL. Parfait pour déboguer les applications web, le développement d'API et comprendre l'anatomie des URL.

  device-information:
    title: Vérificateur d'Informations sur l'Appareil - Info Navigateur & Écran, Détecteur User Agent En Ligne
    description: Détectez et affichez des informations complètes sur l'appareil incluant la résolution d'écran, le ratio de pixels, la taille du viewport, le nom du navigateur, la version du navigateur, le système d'exploitation, la chaîne user agent et les détails de la plateforme. Détecteur d'appareils en ligne gratuit pour les tests de design réactif, l'empreinte digitale du navigateur et le développement web. Vérifiez les spécifications de l'appareil, les dimensions de l'écran et les informations système instantanément.

  basic-auth-generator:
    title: Générateur d'Authentification Basic En Ligne - Encodeur d'En-tête HTTP Authorization Gratuit
    description: Générez des en-têtes d'authentification HTTP Basic à partir d'un nom d'utilisateur et d'un mot de passe. Encodez les identifiants au format Base64 pour les en-têtes Authorization. Générateur d'auth basic en ligne gratuit pour les tests API REST, commandes cURL, requêtes Postman et l'authentification HTTP. Créez des tokens d'auth basic sécurisés pour le développement d'API et l'intégration de services web.

