  ascii-text-drawer:
    title: Generador de Arte ASCII y Dibujante de Texto - Creador de Banners con Fuentes Figlet en Línea
    description: Crea arte ASCII y banners de texto en línea. Convierte texto a arte ASCII con múltiples estilos de fuentes Figlet. Generador de texto ASCII gratuito para banners de terminal, arte de comentarios de código, decoración de README de GitHub y mensajes de Discord/Reddit. Soporta fuentes 3D, letras en bloque, fuentes inclinadas, estilos de sombra y caligrafía. Creador de arte ASCII en línea con copiar y pegar. Perfecto para desarrolladores, programadores y diseño creativo de texto.

  html-entities:
    title: Codificador & Decodificador de Entidades HTML En Línea - Escapar/Desescapar Caracteres HTML Gratis
    description: Codifica y decodifica entidades HTML en línea. Escapa caracteres especiales (<, >, &, ", ') a entidades HTML para prevención XSS y seguridad web. Convierte entidades HTML a texto y viceversa. Convertidor de entidades HTML gratuito para codificar ampersands, comillas, corchetes y caracteres unicode. Perfecto para sanitizar entradas de usuario, prevenir inyección HTML y desarrollo web seguro.

  url-parser:
    title: Analizador de URL En Línea - Decodificar Componentes URL, Query Strings & Parámetros Gratis
    description: Analiza y desglosa URLs en línea. Descompone direcciones web en protocolo, nombre de host, puerto, ruta, parámetros de consulta, hash, nombre de usuario y contraseña. Herramienta de análisis URL gratuita para desarrolladores para decodificar query strings, extraer componentes URL y validar estructura de URL. Perfecto para depurar aplicaciones web, desarrollo de API y comprender la anatomía de URL.

  device-information:
    title: Verificador de Información del Dispositivo - Info Navegador & Pantalla, Detector User Agent En Línea
    description: Detecta y muestra información completa del dispositivo incluyendo resolución de pantalla, relación de píxeles, tamaño del viewport, nombre del navegador, versión del navegador, sistema operativo, cadena user agent y detalles de la plataforma. Detector de dispositivos en línea gratuito para pruebas de diseño responsivo, browser fingerprinting y desarrollo web. Verifica especificaciones del dispositivo, dimensiones de pantalla e información del sistema instantáneamente.

  basic-auth-generator:
    title: Generador de Autenticación Basic En Línea - Codificador de Cabecera HTTP Authorization Gratis
    description: Genera cabeceras de autenticación HTTP Basic desde nombre de usuario y contraseña. Codifica credenciales en formato Base64 para cabeceras Authorization. Generador de auth basic en línea gratuito para pruebas API REST, comandos cURL, peticiones Postman y autenticación HTTP. Crea tokens de auth basic seguros para desarrollo de API e integración de servicios web.

