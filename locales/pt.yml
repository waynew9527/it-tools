  ascii-text-drawer:
    title: Gerador de Arte ASCII e Desenhador de Texto - Criador de Banners com Fonte Figlet On-line
    description: Crie arte ASCII e banners de texto on-line. Converta texto em arte ASCII com vários estilos de fontes Figlet. Gerador de texto ASCII gratuito para banners de terminal, arte de comentários de código, decoração de README do GitHub e mensagens do Discord/Reddit. Suporta fontes 3D, letras em bloco, fontes inclinadas, estilos de sombra e caligrafia. Criador de arte ASCII on-line com copiar e colar. Perfeito para desenvolvedores, programadores e design de texto criativo.

  html-entities:
    title: Codificador & Decodificador de Entidades HTML On-line - Escapar/Desescapar Caracteres HTML Grátis
    description: Codifique e decodifique entidades HTML on-line. Escape caracteres especiais (<, >, &, ", ') para entidades HTML para prevenção XSS e segurança web. Converta entidades HTML para texto e vice-versa. Conversor de entidades HTML gratuito para codificar ampersands, aspas, colchetes e caracteres unicode. Perfeito para higienizar entrada de usuário, prevenir injeção HTML e desenvolvimento web seguro.

  url-parser:
    title: Analisador de URL On-line - Decodificar Componentes URL, Query Strings & Parâmetros Grátis
    description: Analise e decomponha URLs on-line. Divida endereços web em protocolo, nome do host, porta, caminho, parâmetros de consulta, hash, nome de usuário e senha. Ferramenta de análise URL gratuita para desenvolvedores decodificarem query strings, extrair componentes URL e validar estrutura de URL. Perfeito para depurar aplicações web, desenvolvimento de API e entender anatomia de URL.

  device-information:
    title: Verificador de Informações do Dispositivo - Info Navegador & Tela, Detector User Agent On-line
    description: Detecte e exiba informações abrangentes do dispositivo incluindo resolução de tela, razão de pixels, tamanho do viewport, nome do navegador, versão do navegador, sistema operacional, string user agent e detalhes da plataforma. Detector de dispositivos on-line gratuito para testes de design responsivo, fingerprinting de navegador e desenvolvimento web. Verifique especificações do dispositivo, dimensões de tela e informações do sistema instantaneamente.

  basic-auth-generator:
    title: Gerador de Autenticação Basic On-line - Codificador de Cabeçalho HTTP Authorization Grátis
    description: Gere cabeçalhos de autenticação HTTP Basic a partir de nome de usuário e senha. Codifique credenciais em formato Base64 para cabeçalhos Authorization. Gerador de auth basic on-line gratuito para testes API REST, comandos cURL, requisições Postman e autenticação HTTP. Crie tokens de auth basic seguros para desenvolvimento de API e integração de serviços web.

