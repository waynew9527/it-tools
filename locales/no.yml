  hmac-generator:
    title: HMAC-Generator Online - Hash-Basert Meldingsautentiseringskode-Verktøy
    description: Generer HMAC (Hash-basert meldingsautentiseringskode) for dataintegritet og autentisering. Støtter MD5, SHA1, SHA256, SHA224, SHA512, SHA384, SHA3, og RIPEMD160-algoritmer. Perfekt for API-signaturer, webhook-verifisering, JWT-tokens og sikker meldingsautentisering. Opprett kryptografiske signaturer med hemmelige nøkler for REST API-er og datavalidering.

  bip39-generator:
    title: BIP39 Mnemonic & Seed-Frase Generator - Krypto-Lommebok Gjenopprettingsverktøy
    description: Generer BIP39 mnemonic seed-fraser for kryptovaluta-lommebøker. Opprett sikre 12-ords eller 24-ords gjenopprettingsfraser for Bitcoin, Ethereum og andre krypto-lommebøker. Støtte for maskinvare-lommebøker (Ledger, Trezor), HD-lommebøker (BIP32/BIP44), og lommebok backup/gjenoppretting. Generer fra entropi eller eksisterende mnemonic med kryptografisk sikkerhet.

