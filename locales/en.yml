about:
  content: >
    # About IT Tools

    ## What is IT Tools?

    **IT Tools** is a free, open-source collection of handy online utilities designed for developers, IT professionals, and power users. Whether you need to encode data, generate tokens, convert file formats, or analyze network configurations — IT Tools has you covered with a clean and fast interface.

    All tools run **entirely in your browser**. No data is ever uploaded to any server, ensuring your privacy and security.

    ## Our Mission

    We believe developer tools should be free, accessible, and private. IT Tools is built to provide a one-stop toolkit for everyday development tasks, eliminating the need to install local software or search for unreliable third-party services.

    ## This Version

    This is a customized secondary development version based on the original [IT-Tools](https://github.com/CorentinTh/it-tools) project by [Corentin Thomasset](https://corentin.tech). Enhancements include improved UI, additional tools, and extended language support.

    Source code: [https://github.com/waynew9527/it-tools](https://github.com/waynew9527/it-tools)

    ## Technologies

    IT Tools is built with **Vue 3**, the **Naive UI** component library, and bundled with **Vite**. All cryptographic operations and data transformations run client-side using well-audited open-source libraries.

    ## Privacy & Security

    We do **not** collect any personal data or usage statistics. All tool operations are performed locally in your browser. See our [Privacy Policy](/privacy) for full details.

    ## Report an Issue or Request a Feature

    Found a bug or missing a tool? Please submit an issue on our GitHub repository:
    [https://github.com/waynew9527/it-tools/issues](https://github.com/waynew9527/it-tools/issues)

    ## Contact

    For business inquiries or collaboration, please reach out via GitHub Issues:
    [https://github.com/waynew9527/it-tools/issues](https://github.com/waynew9527/it-tools/issues)

privacy:
  pageTitle: 'Privacy Policy - IT Tools'
  metaDescription: 'IT Tools Privacy Policy: We respect your privacy. All tools run client-side in your browser. No personal data is collected or stored.'
  content: >
    # Privacy Policy

    **Last updated: February 2026**

    IT Tools ("we", "us", or "our") operates the website [https://it-tools.eu.cc](https://it-tools.eu.cc) (the "Service"). This page explains our policies regarding the collection, use, and disclosure of personal data when you use our Service.

    ## 1. Data We Do NOT Collect

    IT Tools is designed with privacy as a core principle. We do **not** collect, store, or transmit:

    - Any text, files, or data you enter into our tools
    - Personal identification information (name, email, address, phone number)
    - Browsing history or usage patterns beyond what standard web servers log
    - Payment or financial information

    **All tool operations are performed entirely within your browser (client-side).** Your data never leaves your device.

    ## 2. Automatically Collected Information

    When you visit our website, standard server logs may automatically record:

    - Your IP address
    - Browser type and version
    - Operating system
    - Date and time of your visit
    - Pages visited on our Service

    This information is used solely for maintaining the security and operation of the Service and is not linked to any personally identifiable information.

    ## 3. Cookies

    IT Tools uses only essential functional cookies necessary for the Service to operate (for example, saving your preferences such as dark/light mode, language, and favorite tools). We do **not** use tracking cookies or third-party advertising cookies.

    ## 4. Third-Party Services

    We may use third-party services including:

    - **Google Fonts** – for loading web fonts. Google may collect data per their [Privacy Policy](https://policies.google.com/privacy).
    - **Google AdSense** – to display advertisements. Google uses cookies to serve ads based on your prior visits. You may opt out via [Google's Ads Settings](https://adssettings.google.com/).

    ## 5. Advertising

    We use Google AdSense to display advertisements on our website. Google, as a third-party vendor, uses cookies to serve ads based on your visits to this and other websites. You can opt out of personalized advertising by visiting [Google Ads Settings](https://adssettings.google.com/).

    ## 6. Data Security

    We take reasonable measures to protect the security of our website. Since we do not store user data on our servers, the risk of data breaches affecting you is minimized.

    ## 7. Children's Privacy

    Our Service does not address anyone under the age of 13. We do not knowingly collect personal data from children under 13.

    ## 8. Changes to This Privacy Policy

    We may update this Privacy Policy from time to time. We will notify you of any changes by updating the "Last updated" date at the top of this page. We encourage you to review this Privacy Policy periodically.

    ## 9. Contact Us

    If you have any questions about this Privacy Policy, please contact us:

    - GitHub Issues: [https://github.com/waynew9527/it-tools/issues](https://github.com/waynew9527/it-tools/issues)
    - Website: [https://it-tools.eu.cc](https://it-tools.eu.cc)

