  uuid-generator:
    title: UUID Generator Online - v1, v4, v5 & GUID Generator Tool
    description: Generate universally unique identifiers (UUIDs) online. Create random UUID v4, time-based UUID v1, name-based UUID v3/v5, and nil UUIDs. Perfect for database primary keys, API request IDs, session identifiers, and distributed systems. RFC 4122 compliant 128-bit unique ID generator.
    article: >
      ## What is a UUID?
      
      A **UUID** (Universally Unique Identifier) is a 128-bit number used to uniquely identify information in computer systems. The main advantage of UUIDs is that they can be generated independently without a central authority, while still guaranteeing a negligible probability of duplication.
      
      ## UUID Versions Explained
      
      - **v1 (Time-based)**: Generated using the MAC address of the computer and the current timestamp. It is useful when you need to sort by creation time, but it may expose the MAC address of the generating machine.
      - **v4 (Random)**: The most commonly used version. It relies on a cryptographically secure pseudo-random number generator (CSPRNG) to create a completely random ID. The chance of a collision is practically zero.
      - **v3 & v5 (Name-based)**: Generated by hashing a namespace identifier and a name using MD5 (v3) or SHA-1 (v5). These versions are deterministic, meaning the same namespace and name will always produce the exact same UUID.
      
      ## Why use UUIDs?
      
      In modern distributed systems, microservices, and databases (like Cassandra or MongoDB), relying on auto-incrementing integers (like 1, 2, 3) for primary keys can lead to massive conflicts when merging data or sharding databases. UUIDs solve this problem by ensuring uniqueness across multiple independent nodes. Additionally, they prevent malicious users from guessing the number of records in your database (e.g., if a user sees `/user/5`, they know there are at least 5 users).

