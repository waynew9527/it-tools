    description: Encode and decode HTML entities online. Escape special characters (<, >, &, ", ') to HTML entities for XSS prevention and web security. Convert HTML entities to text and vice versa. Free HTML entity converter for encoding ampersands, quotes, brackets, and unicode characters. Perfect for sanitizing user input, preventing HTML injection, and secure web development.

  json-prettify:
    title: JSON prettify and format
    description: Prettify your JSON string into a friendly, human-readable format.
    article: >
      ## Understanding JSON Format
      
      **JSON** (JavaScript Object Notation) is a lightweight data-interchange format. It is easy for humans to read and write, and easy for machines to parse and generate. Today, it is the standard format for transmitting data between a server and web applications (especially in RESTful APIs).
      
      ## Why format or beautify JSON?
      
      In production environments, APIs often return "minified" JSON to save bandwidth. This means all spaces, line breaks, and formatting are removed. For example:
      `&#123;"user":&#123;"id":123,"name":"John Doe","isActive":true&#125;,"roles":["admin","user"]&#125;`
      
      While computers can easily parse this, it is practically unreadable for a developer trying to debug an issue or understand the data structure.
      
      A **JSON formatter** helps you by:
      1. **Indenting and Formatting**: Converting minified JSON into a structured, tree-like format with proper indentation.
      2. **Syntax Highlighting**: Using different colors for keys, strings, numbers, and booleans, making it much easier to visually scan the data.
      3. **Error Detection**: If you are writing JSON manually and forget a comma or have mismatched brackets, the formatter will detect the invalid syntax and help you fix it.
      
      ## JSON Best Practices
      
      - All keys and string values must be enclosed in **double quotes (" ")**. Single quotes are not valid JSON.
      - There should be **no trailing comma** after the last element in an object or array.
      - JSON supports the following data types: Objects `&#123;&#125;`, Arrays `[]`, Strings `" "`, Numbers `123`, Booleans `true/false`, and `null`.

  docker-run-to-docker-compose-converter:
    title: Docker run to Docker compose converter
    description: Transforms "docker run" commands into docker-compose files!

  mac-address-lookup:
