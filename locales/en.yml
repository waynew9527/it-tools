  crontab-generator:
    title: Crontab generator
    description: Validate and generate crontab and get the human-readable description of the cron schedule.
    article: >
      ## What is Cron and Crontab?
      
      **Cron** is a time-based job scheduler in Unix-like operating systems (such as Linux and macOS). System administrators and developers use Cron to set up jobs (commands or shell scripts) to run periodically at fixed times, dates, or intervals.
      
      **Crontab** (short for Cron table) is the configuration file that specifies shell commands to run periodically on a given schedule.
      
      ## Crontab Expression Syntax
      
      A standard crontab expression consists of 5 fields separated by spaces:
      
      ```
      * * * * * command to execute
      - - - - -
      │ │ │ │ │
      │ │ │ │ +----- day of the week (0 - 7) (Sunday is 0 or 7)
      │ │ │ +------- month (1 - 12)
      │ │ +--------- day of the month (1 - 31)
      │ +----------- hour (0 - 23)
      +------------- minute (0 - 59)
      ```
      
      ## Special Characters
      
      - `*` (Asterisk): Represents "every". For example, `*` in the minute field means "every minute".
      - `,` (Comma): Used to separate items in a list. For example, `1,3,5` in the hours field means execution at 1 AM, 3 AM, and 5 AM.
      - `-` (Hyphen): Defines a range. For example, `1-5` means all values from 1 through 5.
      - `/` (Slash): Specifies step values. For example, `*/5` in the minute field means "every 5 minutes".
      
      ## Common Use Cases
      
      1. **Database Backups**: Automatically running a backup script every night at 3 AM.
      2. **Log Cleaning**: Deleting old log files every Sunday to free up disk space.
      3. **Sending Reports**: Generating and emailing monthly performance reports on the 1st of every month.

