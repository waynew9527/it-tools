  ascii-text-drawer:
    title: Генератор ASCII-мистецтва та Текстовий Редактор - Створювач Банерів зі Шрифтами Figlet Онлайн
    description: Створюйте ASCII-мистецтво та текстові банери онлайн. Перетворюйте текст на ASCII-мистецтво з кількома стилями шрифтів Figlet. Безкоштовний генератор ASCII-тексту для термінальних банерів, мистецтва коментарів до коду, оформлення README на GitHub та повідомлень у Discord/Reddit. Підтримує 3D-шрифти, блокові літери, похилі шрифти, тіньові стилі та каліграфію. Онлайн-створювач ASCII-мистецтва з копіюванням та вставкою. Ідеально для розробників, програмістів та креативного дизайну тексту.

  html-entities:
    title: Кодувальник & Декодувальник HTML-сутностей Онлайн - Екранування/Деекранування HTML-символів Безкоштовно
    description: Кодуйте та декодуйте HTML-сутності онлайн. Екрануйте спеціальні символи (<, >, &, ", ') в HTML-сутності для запобігання XSS та безпеки веб-сайтів. Конвертуйте HTML-сутності в текст і навпаки. Безкоштовний конвертер HTML-сутностей для кодування амперсандів, лапок, дужок та unicode-символів. Ідеально для санітизації користувацьких даних, запобігання HTML-ін'єкціям та безпечної веб-розробки.

  url-parser:
    title: Парсер URL Онлайн - Декодування URL-компонентів, Query Strings & Параметрів Безкоштовно
    description: Парсіть і аналізуйте URL-адреси онлайн. Розбивайте веб-адреси на протокол, ім'я хоста, порт, шлях, параметри запиту, хеш, ім'я користувача та пароль. Безкоштовний інструмент парсингу URL для розробників для декодування query strings, вилучення URL-компонентів та валідації структури URL. Ідеально для налагодження веб-додатків, розробки API та розуміння анатомії URL.

  device-information:
    title: Перевірка Інформації про Пристрій - Інфо Браузера & Екрану, Детектор User Agent Онлайн
    description: Визначайте та відображайте вичерпну інформацію про пристрій, включаючи роздільну здатність екрану, співвідношення пікселів, розмір viewport, назву браузера, версію браузера, операційну систему, рядок user agent та деталі платформи. Безкоштовний онлайн-детектор пристроїв для тестування адаптивного дизайну, fingerprinting браузера та веб-розробки. Перевіряйте специфікації пристрою, розміри екрану та системну інформацію миттєво.

  basic-auth-generator:
    title: Генератор Basic Auth Онлайн - Кодувальник HTTP Authorization Header Безкоштовно
    description: Генеруйте HTTP Basic Authentication заголовки з імені користувача та пароля. Кодуйте облікові дані у формат Base64 для заголовків Authorization. Безкоштовний онлайн-генератор basic auth для тестування REST API, команд cURL, запитів Postman та HTTP-аутентифікації. Створюйте безпечні basic auth-токени для розробки API та інтеграції веб-сервісів.

